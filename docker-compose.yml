# Single-service stack: FastAPI serves the API *and* the exported frontend.
# Build context is the repo root so the frontend can be compiled too.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: swing
      POSTGRES_PASSWORD: swing
      POSTGRES_DB: swingtrader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swing -d swingtrader"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://swing:swing@db:5432/swingtrader
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      DATA_PROVIDER: ${DATA_PROVIDER:-auto}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      STATIC_DIR: /app/static
      # In-process scheduler is fine for a long-running container.
      DISABLE_SCHEDULER: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
