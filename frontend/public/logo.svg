    <rect x="14" y="34" width="10" height="17" rx="5" fill="url(#stpBar)"/>
    <rect x="27" y="25" width="10" height="26" rx="5" fill="url(#stpBar)"/>
    <rect x="40" y="15" width="10" height="36" rx="5" fill="url(#stpBar)"/>
