  <!-- Wordmark: baseline tuned so cap-heights centre on y=24 -->
  <text x="52" y="30.5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#e2e8f0" letter-spacing="-0.3">Swing Trading Picks</text>
