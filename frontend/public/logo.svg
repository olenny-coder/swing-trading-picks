<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 48" width="244" height="48" role="img" aria-label="Swing Trading Picks">
  <defs>
    <linearGradient id="stpBar" gradientUnits="userSpaceOnUse" x1="14" y1="51" x2="50" y2="15">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Mark: 40x40, vertically centred on y=24 (same motif as app/icon.svg) -->
