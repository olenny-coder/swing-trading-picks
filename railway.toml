# Railway configuration for the FastAPI backend.
# Set DATABASE_URL, SECRET_KEY, and (optionally) ALPACA_* as Railway variables.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 30
